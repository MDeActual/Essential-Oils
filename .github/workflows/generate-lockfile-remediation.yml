name: Generate Phyto Dependency Remediation Lockfile

on:
  push:
    branches:
      - agent/phyto-dependency-remediation-v1
  pull_request:
    branches:
      - audit/post-pr17-readiness
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile within declared semver ranges
        run: npm update prisma @prisma/client --package-lock-only --ignore-scripts
      - name: Verify package manifest is unchanged
        run: git diff --exit-code -- package.json
      - name: Verify no unexpected files changed
        run: |
          unexpected="$(git diff --name-only | grep -v '^package-lock.json$' || true)"
          test -z "$unexpected"
      - name: Validate clean install, build, and tests
        run: |
          npm ci
          npm run build
          npm test -- --runInBand
      - name: Verify production dependency gate
        run: npm audit --omit=dev --audit-level=high
      - name: Commit validated lockfile to remediation branch
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: refresh Prisma dependency lockfile'
          git push origin HEAD:agent/phyto-dependency-remediation-v1
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: phyto-remediated-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
